version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: financas_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: financas
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  api:
    build: . 
    container_name: financas_api
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mysql://root:root@mysql:3306/financas
      - JWT_SECRET=jwt_secret
      - PORT=3000
    depends_on:
      mysql:
        condition: service_healthy 

volumes:
  mysql_data: